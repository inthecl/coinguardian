<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Coin Guardian</title>
    <style>
        :root {
            --bg: #121212;
            --bg-raised: #1a1a1a;
            --gold: #f3d03e;
            --gold-dim: #b89a2e;
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --text-faint: #666666;
            --border: #2a2a2a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            color: inherit;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 26, 26, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: block;
        }

        .brand h1 {
            color: var(--gold);
            font-size: 1.4rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        nav.main-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        nav.main-nav a {
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-dim);
            padding: 9px 16px;
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        nav.main-nav a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
        }

        nav.main-nav a.active {
            color: #121212;
            background: var(--gold);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        @media (max-width: 760px) {
            nav.main-nav {
                position: fixed;
                top: 64px;
                left: 0;
                right: 0;
                background: var(--bg-raised);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                align-items: stretch;
                padding: 8px;
                gap: 2px;
                display: none;
            }
            nav.main-nav.open {
                display: flex;
            }
            nav.main-nav a {
                width: 100%;
                text-align: center;
            }
            .nav-toggle {
                display: block;
            }
            .brand h1 {
                font-size: 1.2rem;
            }
        }

        .coming-soon {
            min-height: calc(100vh - 68px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .coming-soon h2 {
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 800;
            color: var(--gold);
            margin: 0;
            letter-spacing: -0.5px;
        }

        footer {
            text-align: center;
            padding: 60px 40px;
            background: #000;
            color: var(--text-faint);
            font-size: 0.85rem;
        }

        .contact {
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="brand">
        <img src="coin_app_icon.webp" alt="Coin Guardian" class="logo">
        <h1>Coin Guardian</h1>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>

    <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="indicators.html">Indicators</a>
        <a href="referral.html" class="active">Get 1 Year Free</a>
    </nav>
</header>

<section class="coming-soon">
    <h2>Coming Soon</h2>
</section>

<footer style="background: #000; padding: 60px 24px;">
  <div class="footer-inner" style="max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; text-align: left;">
    <div class="footer-text">
      <p style="margin: 0; color: var(--text-faint); font-size: 0.85rem;">&copy; 2026 Coin Guardian. Empowering crypto traders worldwide.</p>
      <p style="margin: 6px 0 0; color: var(--text-faint); font-size: 0.85rem;">Contact: <a href="mailto:coinguardian.app@gmail.com" class="contact">coinguardian.app@gmail.com</a></p>
    </div>

    <a href="https://play.google.com/store/apps/details?id=com.coinguardian.app" class="footer-badge">
      <img src="google-play-badge.png" alt="Get it on Google Play" style="height: 50px;">
    </a>
  </div>
</footer>

<style>
  @media (max-width: 600px) {
    .footer-inner {
      flex-direction: column;
      text-align: center !important;
      justify-content: center !important;
    }
    .footer-badge {
      order: -1;
      margin-bottom: 8px;
    }
  }
</style>

<script>
    const toggle = document.getElementById('navToggle');
    const nav = document.getElementById('mainNav');
    toggle.addEventListener('click', () => {
        nav.classList.toggle('open');
    });
</script>

</body>
</html>
